  <main class="wrap page">
    <p class="eyebrow">Build notes · Tools · Videos</p>
    <h1>Blog &amp; Videos</h1>
    <p class="lead">Notes and videos about building software, DevOps, and resilient infrastructure.</p>
    <div class="controls">
      <label for="type-filter">Content type</label>
      <select id="type-filter">
        <option value="all">Everything</option>
        <option value="article">Articles</option>
        <option value="video">Videos</option>
      </select>
      <label class="visually-hidden" for="search">Search posts</label>
      <input id="search" type="search" placeholder="Search articles and videos" autocomplete="off">
    </div>
    <section id="feed" class="feed" aria-label="Blog posts" aria-live="polite"></section>
    <p id="empty-state" class="empty" hidden>No posts yet. New articles and videos will appear here.</p>
  </main>
  <footer>
    <div class="wrap foot">
      <p>&copy; 2026 Emilio Dueñas</p>
    </div>
  </footer>
  <script>
    const feed = document.querySelector("#feed");
    const emptyState = document.querySelector("#empty-state");
    const typeFilter = document.querySelector("#type-filter");
    const search = document.querySelector("#search");
    const dateFormatter = new Intl.DateTimeFormat("en", { dateStyle: "long", timeZone: "UTC" });
    let entries = [];

    function addText(parent, tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = text;
      parent.append(element);
      return element;
    }

    function getDate(value) {
      const date = new Date(`${value}T00:00:00Z`);
      return Number.isNaN(date.valueOf()) ? value : dateFormatter.format(date);
    }

    function safeVideoId(value) {
      return typeof value === "string" && /^[A-Za-z0-9_-]{11}$/.test(value) ? value : null;
    }

    function render() {
      const kind = typeFilter.value;
      const term = search.value.trim().toLocaleLowerCase();
      const visible = entries.filter((entry) => {
        const matchesType = kind === "all" || entry.type === kind;
        const matchesText = `${entry.title} ${entry.summary} ${(entry.tags || []).join(" ")}`.toLocaleLowerCase().includes(term);
        return matchesType && matchesText;
      });
      feed.replaceChildren();
      emptyState.hidden = visible.length > 0;
      if (entries.length && !visible.length) emptyState.textContent = "No posts match your search. Try a different term or filter.";
      else emptyState.textContent = "No posts yet. New articles and videos will appear here.";

      for (const entry of visible) {
        const card = document.createElement("article");
        card.className = "card";
        if (entry.type === "video") {
          const frame = document.createElement("div");
          frame.className = "frame";
          const iframe = document.createElement("iframe");
          iframe.src = `https://www.youtube-nocookie.com/embed/${safeVideoId(entry.youtubeId)}`;
          iframe.title = `Video: ${entry.title}`;
          iframe.loading = "lazy";
          iframe.referrerPolicy = "strict-origin-when-cross-origin";
          iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
          iframe.allowFullscreen = true;
          frame.append(iframe);
          card.append(frame);
        }

        const details = document.createElement("div");
        details.className = "details";
        const meta = document.createElement("div");
        meta.className = "meta";
        addText(meta, "span", "kind", entry.type === "video" ? "Video" : "Article");
        const time = addText(meta, "time", "", getDate(entry.date));
        time.dateTime = entry.date;
        details.append(meta);
        const heading = addText(details, "h2", "", entry.title);
        if (entry.type === "article") {
          const link = document.createElement("a");
          link.href = entry.url;
          link.className = "read-more";
          link.textContent = "Read article →";
          heading.replaceChildren(link);
        }
        if (entry.summary) addText(details, "p", "summary", entry.summary);
        card.append(details);
        feed.append(card);
      }
    }

    typeFilter.addEventListener("change", render);
    search.addEventListener("input", render);

    Promise.all([
      fetch("/blog/articles.json").then((response) => { if (!response.ok) throw new Error(); return response.json(); }),
      fetch("/videos/videos.json").then((response) => { if (!response.ok) throw new Error(); return response.json(); })
    ]).then(([articles, videos]) => {
      const validArticles = Array.isArray(articles) ? articles
        .filter((item) => item && item.title && item.date && item.summary && typeof item.url === "string" && item.url.startsWith("/blog/posts/"))
        .map((item) => ({ ...item, type: "article" })) : [];
      const validVideos = Array.isArray(videos) ? videos
        .filter((item) => item && item.title && item.date && safeVideoId(item.youtubeId))
        .map((item) => ({ ...item, summary: item.description || "", type: "video" })) : [];
      entries = [...validArticles, ...validVideos].sort((a, b) => b.date.localeCompare(a.date));
      render();
    }).catch(() => {
      emptyState.hidden = false;
      emptyState.textContent = "Posts could not be loaded right now. Please try again later.";
    });
  </script>
